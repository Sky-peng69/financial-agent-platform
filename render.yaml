services:
  # FastAPI 后端
  - type: web
    name: yijin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DEEPSEEK_API_KEY
        value: sk-4798701be73f4753be3d9ccb34ff0b37
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yijin-db
          property: connectionString
      - key: REDIS_URL
        value: redis://placeholder:6379/0
      - key: FRONTEND_URL
        value: https://yijin-301.netlify.app
    plan: free

databases:
  - name: yijin-db
    plan: free
