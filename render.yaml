services:
  # FastAPI 后端
  - type: web
    name: yijin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: demo
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: yijin-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
    plan: free

databases:
  - name: yijin-db
    plan: free
